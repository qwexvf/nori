name: test

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.19.2"
          rebar3-version: "3"
      - run: gleam deps download
      - run: gleam check
      - run: gleam test
      - run: gleam format --check src test
      - name: Examples match the generator
        run: |
          examples/regenerate.sh
          git status --porcelain -- examples
          test -z "$(git status --porcelain -- examples)"
      - name: wisp_app example
        working-directory: examples/wisp_app
        run: |
          gleam test
          gleam format --check src test
